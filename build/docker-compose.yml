name: xin-api

# 统一日志轮转策略，避免长时间运行后日志撑满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: xin-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 仅绑定本机回环地址，避免数据库直接暴露到公网
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - xin-api-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: xin-api-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-123456}"
      - --appendonly
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks:
      - xin-api-network

  # 后端应用服务（前端构建产物已打包进镜像）
  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: xin-api:latest
    container_name: xin-api-app
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      PROXY_PORT: ${PROXY_PORT:-8080}
      GIN_MODE: ${GIN_MODE:-release}
      GATEWAY_NODE: ${GATEWAY_NODE:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-20}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置，可用 openssl rand -base64 48 生成}
      JWT_EXPIRE: ${JWT_EXPIRE:-24h}
      # 首次初始化 admin 账号的口令；为空时由服务随机生成并打印到启动日志
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_RECOVERY_INTERVAL: ${CB_RECOVERY_INTERVAL:-60s}
      CACHE_CHANNEL_EXPIRE: ${CACHE_CHANNEL_EXPIRE:-300s}
      PROXY_REQUEST_TIMEOUT: ${PROXY_REQUEST_TIMEOUT:-120s}
      PROXY_MAX_BODY_MB: ${PROXY_MAX_BODY_MB:-10}
      LOG_REQUEST_BODY: ${LOG_REQUEST_BODY:-false}
      LOG_RESPONSE_BODY: ${LOG_RESPONSE_BODY:-false}
      USD_CNY_RATE: ${USD_CNY_RATE:-7.2}
    expose:
      - "${PROXY_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider \"http://127.0.0.1:$${PROXY_PORT}/\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - xin-api-network

  # Nginx 反向代理（对外唯一入口）
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: xin-api-nginx:latest
    container_name: xin-api-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      # 必须与 app 的 PROXY_PORT 保持一致
      PROXY_PORT: ${PROXY_PORT:-8080}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - xin-api-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  xin-api-network:
    driver: bridge
